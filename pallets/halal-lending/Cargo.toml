[package]
name = "pallet-halal-lending"
version = "0.1.0"
edition = "2021"
authors = ["Yehia Tarek <yehiatarej67@gmail.com>","Menna Abdelwahed <email>"]

[dependencies]
# Standard parachain template dependencies
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
log = { workspace = true }
polkadot-sdk = { workspace = true, features = [
    "pallet-balances",
    "frame-support",
    "frame-system", 
    "frame-benchmarking",
    "sp-runtime",
    "sp-std",
    "sp-core",
    "sp-io"
], default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "polkadot-sdk/std",
    "log/std",
]
runtime-benchmarks = [
    "polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
    "polkadot-sdk/try-runtime",
]
